name: Timeweb diagnostics
on:
  push:
    branches: [codex/timeweb-diagnostics]
    paths: [.github/workflows/timeweb-diagnostics.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only service and profit category diagnostics
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            set -eu
            test "$(hostname -s)" = "8384475-da279743"
            cd /opt/zavod
            git rev-parse HEAD
            systemctl is-active zavod.service
            /opt/zavod/venv/bin/python - <<'PY'
            import requests
            from dotenv import dotenv_values
            c=dotenv_values('/opt/zavod/.env')
            print('CONFIG_READY:',{k:bool(c.get(k)) for k in ['EOVR_API_KEY','ADMIN_PASS']})
            r=requests.get('http://127.0.0.1:8000/api/data',timeout=15)
            r.raise_for_status()
            data=r.json()
            for month in ['Сентябрь','Октябрь']:
                ops=[o for o in data.get(month,{}).get('ops',[]) if o.get('is_debit') and o.get('cat')=='Из прибыли']
                print(month, 'Из прибыли:',sum(o.get('amount',0) for o in ops), 'операций:',len(ops))
            print('READ_ONLY_DIAGNOSTICS_OK')
            PY
