name: Timeweb diagnostics
on:
  push:
    branches: [codex/timeweb-diagnostics]
    paths: [.github/workflows/timeweb-diagnostics.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Novator server without changes
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            set -eu
            test "$(hostname -s)" = "8384475-da279743"
            cd /opt/zavod
            /opt/zavod/venv/bin/python - <<'PY'
            import ast, os, shutil, time
            from pathlib import Path
            from dotenv import dotenv_values, set_key
            tree=ast.parse(Path('main.py').read_text())
            found={}
            for node in tree.body:
                if not isinstance(node, ast.Assign): continue
                for target in node.targets:
                    if not isinstance(target, ast.Name): continue
                    if target.id == 'EOVR_API_KEY' and isinstance(node.value,ast.Constant):
                        found[target.id]=node.value.value
                    if target.id == 'ADMIN_PASS' and isinstance(node.value,ast.Call) and len(node.value.args)>1:
                        found[target.id]=ast.literal_eval(node.value.args[1])
            env=dotenv_values('.env')
            missing=[k for k in ['EOVR_API_KEY','ADMIN_PASS'] if not env.get(k)]
            assert all(isinstance(found.get(k),str) and found[k] for k in missing), 'Cannot preserve configuration safely'
            if missing:
                backup=Path('.env.before-profit-'+str(time.time_ns()))
                shutil.copy2('.env',backup)
                backup.chmod(0o600)
                for k in missing: set_key('.env',k,found[k])
                Path('.env').chmod(0o600)
            assert all(dotenv_values('.env').get(k) for k in ['EOVR_API_KEY','ADMIN_PASS'])
            print('CONFIG_PRESERVED')
            PY
