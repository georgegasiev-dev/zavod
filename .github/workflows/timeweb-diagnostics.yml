name: Timeweb diagnostics
on:
  push:
    branches: [codex/timeweb-diagnostics]
    paths: [.github/workflows/timeweb-diagnostics.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Novator server without changes
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            set -eu
            test "$(hostname -s)" = "8384475-da279743"
            cd /opt/zavod
            git rev-parse HEAD
            /opt/zavod/venv/bin/python - <<'PY'
            from dotenv import dotenv_values
            c=dotenv_values('/opt/zavod/.env')
            ready={k:bool(c.get(k)) for k in ['EOVR_API_KEY','ADMIN_PASS']}
            print('DEPLOYMENT_CONFIGURATION_READY:',ready)
            assert all(ready.values())
            PY
            systemctl is-active zavod.service
