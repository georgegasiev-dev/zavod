name: Disable and verify FSSP monitoring

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/disable-fssp.yml'

permissions:
  contents: read

jobs:
  main-server:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disable FSSP and verify main server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 3m
          script: |
            set -e
            cd /opt/zavod
            python3 - <<'PY'
            import ast
            import os
            import shutil
            import subprocess
            import tempfile
            import time
            from datetime import datetime
            from pathlib import Path
            
            path = Path('/opt/zavod/main.py')
            source = path.read_text(encoding='utf-8')
            tree = ast.parse(source)
            lines = source.splitlines(keepends=True)
            edits = []
            for node in ast.walk(tree):
                if isinstance(node, (ast.AsyncFunctionDef, ast.FunctionDef)) and node.name == 'scheduled_fssp_check':
                    indent = ' ' * node.col_offset
                    edits.append((node.lineno - 1, node.end_lineno, indent + 'async def scheduled_fssp_check():\n' + indent + '    """FSSP monitoring disabled by owner."""\n' + indent + '    return\n'))
                if isinstance(node, ast.Expr) and isinstance(node.value, ast.Call):
                    call = node.value
                    if isinstance(call.func, ast.Attribute) and call.func.attr == 'add_job':
                        handler = any(isinstance(arg, ast.Name) and arg.id == 'scheduled_fssp_check' for arg in call.args)
                        job_id = any(kw.arg == 'id' and isinstance(kw.value, ast.Constant) and kw.value.value == 'fssp_check' for kw in call.keywords)
                        if handler or job_id:
                            edits.append((node.lineno - 1, node.end_lineno, ' ' * node.col_offset + 'pass  # FSSP monitoring disabled by owner.\n'))
            for start, end, replacement in sorted(edits, reverse=True):
                lines[start:end] = [replacement]
            updated = ''.join(lines)
            ast.parse(updated)
            assert 'from fssp_monitor import check_fssp' not in updated, 'Unexpected FSSP call site; abort'
            for node in ast.walk(ast.parse(updated)):
                if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute) and node.func.attr == 'add_job':
                    assert not any(isinstance(arg, ast.Name) and arg.id == 'scheduled_fssp_check' for arg in node.args)
                    assert not any(kw.arg == 'id' and isinstance(kw.value, ast.Constant) and kw.value.value == 'fssp_check' for kw in node.keywords)
            changed = updated != source
            if changed:
                backup = path.with_name('main.py.before-disable-fssp-' + datetime.now().strftime('%Y%m%d-%H%M%S-%f') + '.bak')
                shutil.copy2(path, backup)
                meta = path.stat()
                fd, temporary = tempfile.mkstemp(prefix='.disable-fssp-', dir=path.parent)
                try:
                    with os.fdopen(fd, 'w', encoding='utf-8') as stream:
                        stream.write(updated)
                        stream.flush()
                        os.fsync(stream.fileno())
                    os.chmod(temporary, meta.st_mode & 0o777)
                    os.chown(temporary, meta.st_uid, meta.st_gid)
                    assert path.read_text(encoding='utf-8') == source, 'File changed during update'
                    os.replace(temporary, path)
                finally:
                    if os.path.exists(temporary):
                        os.unlink(temporary)
                try:
                    subprocess.run(['systemctl', 'restart', 'zavod.service'], check=True, timeout=60)
                except BaseException:
                    shutil.copy2(backup, path)
                    subprocess.run(['systemctl', 'restart', 'zavod.service'], timeout=60)
                    raise
                print('FSSP_DISABLED: patched and restarted')
            else:
                print('FSSP_DISABLED: already deployed')
            time.sleep(3)
            subprocess.run(['systemctl', 'is-active', '--quiet', 'zavod.service'], check=True)
            print('SERVICE_ACTIVE: yes')
            print('FSSP_JOB_REGISTERED: no')
            print('SOURCE_SYNTAX: valid')
            PY

  bot-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Disable FSSP on bot through existing main-server SSH access
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 8m
          script: |
            set -e
            python3 - <<'PY'
            import os
            import subprocess
            from pathlib import Path
            
            ssh_dir = Path.home()/'.ssh'
            candidates = []
            if ssh_dir.exists():
                for path in sorted(ssh_dir.iterdir()):
                    if path.is_file() and not path.is_symlink() and path.stat().st_size < 65536:
                        try:
                            head = path.read_bytes()[:100]
                            if b'PRIVATE KEY-----' in head:
                                candidates.append(path)
                        except (OSError, ValueError):
                            pass
            print('Local SSH private key files found:', len(candidates))
            script = "set -e\ncd /opt/zavod\npython3 - <<'PY'\nimport ast\nimport os\nimport shutil\nimport subprocess\nimport tempfile\nimport time\nfrom datetime import datetime\nfrom pathlib import Path\n\npath = Path('/opt/zavod/main.py')\nsource = path.read_text(encoding='utf-8')\ntree = ast.parse(source)\nlines = source.splitlines(keepends=True)\nedits = []\nfor node in ast.walk(tree):\n    if isinstance(node, (ast.AsyncFunctionDef, ast.FunctionDef)) and node.name == 'scheduled_fssp_check':\n        indent = ' ' * node.col_offset\n        edits.append((node.lineno - 1, node.end_lineno, indent + 'async def scheduled_fssp_check():\\n' + indent + '    \"\"\"FSSP monitoring disabled by owner.\"\"\"\\n' + indent + '    return\\n'))\n    if isinstance(node, ast.Expr) and isinstance(node.value, ast.Call):\n        call = node.value\n        if isinstance(call.func, ast.Attribute) and call.func.attr == 'add_job':\n            handler = any(isinstance(arg, ast.Name) and arg.id == 'scheduled_fssp_check' for arg in call.args)\n            job_id = any(kw.arg == 'id' and isinstance(kw.value, ast.Constant) and kw.value.value == 'fssp_check' for kw in call.keywords)\n            if handler or job_id:\n                edits.append((node.lineno - 1, node.end_lineno, ' ' * node.col_offset + 'pass  # FSSP monitoring disabled by owner.\\n'))\nfor start, end, replacement in sorted(edits, reverse=True):\n    lines[start:end] = [replacement]\nupdated = ''.join(lines)\nast.parse(updated)\nassert 'from fssp_monitor import check_fssp' not in updated, 'Unexpected FSSP call site; abort'\nfor node in ast.walk(ast.parse(updated)):\n    if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute) and node.func.attr == 'add_job':\n        assert not any(isinstance(arg, ast.Name) and arg.id == 'scheduled_fssp_check' for arg in node.args)\n        assert not any(kw.arg == 'id' and isinstance(kw.value, ast.Constant) and kw.value.value == 'fssp_check' for kw in node.keywords)\nchanged = updated != source\nif changed:\n    backup = path.with_name('main.py.before-disable-fssp-' + datetime.now().strftime('%Y%m%d-%H%M%S-%f') + '.bak')\n    shutil.copy2(path, backup)\n    meta = path.stat()\n    fd, temporary = tempfile.mkstemp(prefix='.disable-fssp-', dir=path.parent)\n    try:\n        with os.fdopen(fd, 'w', encoding='utf-8') as stream:\n            stream.write(updated)\n            stream.flush()\n            os.fsync(stream.fileno())\n        os.chmod(temporary, meta.st_mode & 0o777)\n        os.chown(temporary, meta.st_uid, meta.st_gid)\n        assert path.read_text(encoding='utf-8') == source, 'File changed during update'\n        os.replace(temporary, path)\n    finally:\n        if os.path.exists(temporary):\n            os.unlink(temporary)\n    try:\n        subprocess.run(['systemctl', 'restart', 'zavod.service'], check=True, timeout=60)\n    except BaseException:\n        shutil.copy2(backup, path)\n        subprocess.run(['systemctl', 'restart', 'zavod.service'], timeout=60)\n        raise\n    print('FSSP_DISABLED: patched and restarted')\nelse:\n    print('FSSP_DISABLED: already deployed')\ntime.sleep(3)\nsubprocess.run(['systemctl', 'is-active', '--quiet', 'zavod.service'], check=True)\nprint('SERVICE_ACTIVE: yes')\nprint('FSSP_JOB_REGISTERED: no')\nprint('SOURCE_SYNTAX: valid')\nPY"
            attempts = [None] + candidates
            for key in attempts:
                command = ['ssh', '-o', 'BatchMode=yes', '-o', 'ConnectTimeout=10',
                           '-o', 'ConnectionAttempts=1', '-o', 'StrictHostKeyChecking=accept-new']
                if key is not None:
                    command += ['-o', 'IdentitiesOnly=yes', '-i', str(key)]
                command += ['root@45.8.98.214', 'bash', '-s']
                try:
                    result = subprocess.run(command, input=script, capture_output=True, text=True, timeout=150)
                except subprocess.TimeoutExpired:
                    print('Bot connection timed out')
                    continue
                if result.returncode == 0:
                    print(result.stdout)
                    print('BOT_ACCESS_FROM_MAIN: verified')
                    break
                print('Bot SSH attempt exit:', result.returncode)
            else:
                print('BOT_ACCESS_FROM_MAIN: unavailable')
                env_path = Path('/opt/zavod/.env')
                if env_path.is_file():
                    import re
                    names = re.findall(r'(?m)^\s*(?:export\s+)?([A-Z_][A-Z0-9_]*)\s*=', env_path.read_text())
                    names = [n for n in names if 'TIMEWEB' in n or n.startswith('SSH_')]
                    print('Deployment-related environment variable names:', ', '.join(names) or 'none')
                raise SystemExit(1)
            PY
