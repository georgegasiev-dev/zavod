name: Deploy to Timeweb

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployed source
        uses: actions/checkout@v4
      - name: Set up parser tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify catalog parsing and price history before deployment
        run: |
          pip install requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.2.2
          python -m unittest test_fanera_msk test_competitor_refresh test_psk_holding test_security_boundary test_telegram_reporter -v
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/zavod
            git pull --ff-only origin main
            systemctl restart zavod
            VERIFY_API_BASE=http://127.0.0.1:8000 VERIFY_USE_SERVICE_ENV=1 /opt/zavod/venv/bin/python3 verify_contractor_deployment.py
            /opt/zavod/venv/bin/python3 verify_telegram_report_deployment.py
            if ssh -i /root/.ssh/github_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 root@45.8.98.214 true >/dev/null 2>&1; then
              echo "Secondary server existing-key access: available"
            else
              echo "Secondary server existing-key access: unavailable"
            fi
            echo "Deploy verified"
